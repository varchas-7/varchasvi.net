<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The official website of Varchasvi.">
    <title>Varchasvi</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #08111f;
            color: #f5f1e9;
            font-family: Georgia, serif;
            text-align: center;
        }

        main {
            padding: 30px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: normal;
            letter-spacing: 3px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 24px;
            border: 1px solid #d4a373;
            color: #d4a373;
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
        }

        a:hover {
            background: #d4a373;
            color: #08111f;
        }
    </style>
</head>
<body>
    <main>
        <h1>A new chapter begins.</h1>
        <a href="/wedding-invitation/">
            Wedding Invitation
        </a>
    </main>
</body>
</html>
