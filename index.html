<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Varchasvi &amp; Isha — Wedding Invitation</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Great+Vibes&amp;family=Noto+Serif+Kannada:wght@400;600&amp;display=swap">
  <style>
    :root {
      --bg: #f7f1e4;
      --ink: #4a1824;
      --soft: #7a4a50;
      --gold: #a97c2c;
      --card: #fffaf0;
      --teal: #24524f;
      --line: rgba(169, 124, 44, .45);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #2a0f17;
        --ink: #f4e8d0;
        --soft: #d6bfb0;
        --gold: #dcb76c;
        --card: #3a1824;
        --teal: #8fc2b8;
        --line: rgba(220, 183, 108, .4)
      }
    }

    :root[data-theme="dark"] {
      --bg: #2a0f17;
      --ink: #f4e8d0;
      --soft: #d6bfb0;
      --gold: #dcb76c;
      --card: #3a1824;
      --teal: #8fc2b8;
      --line: rgba(220, 183, 108, .4)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      scroll-behavior: smooth
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Cormorant Garamond', 'Noto Serif Kannada', serif;
      font-size: 19px;
      line-height: 1.55;
      text-align: center;
      overflow-x: hidden
    }

    .script {
      font-family: 'Great Vibes', 'Noto Serif Kannada', cursive;
      font-weight: 400
    }

    :lang(kn) .script {
      font-family: 'Noto Serif Kannada', serif;
      font-weight: 600
    }

    #lang {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: 12px;
      z-index: 20;
      display: flex;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 99px;
      overflow: hidden;
      background: rgba(40, 10, 18, .45);
      backdrop-filter: blur(6px)
    }

    #lang button {
      font: inherit;
      font-size: 15px;
      color: #fff;
      background: none;
      border: 0;
      padding: 5px 13px;
      cursor: pointer
    }

    #lang button[aria-pressed=true] {
      background: #e2c27a;
      color: #3a1220
    }

    /* cover */
    .cover {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 20px 28px;
      background: #2a0f17;
      color: #fff7e6;
      gap: 14px
    }

    .arch {
      position: relative;
      width: min(80vw, 340px);
      height: min(62svh, 520px);
      border: 1px solid #e2c27a;
      border-radius: 999px 999px 0 0;
      padding: 7px
    }

    .arch-in {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 999px 999px 0 0;
      overflow: hidden;
      background: #3a1220
    }

    .blur {
      position: absolute;
      inset: -8px;
      filter: blur(5px) brightness(.62) saturate(1.1);
      overflow: hidden
    }

    .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: 50% 30%;
      will-change: transform;
      animation: zoom 20s ease-in-out infinite alternate
    }

    @keyframes zoom {
      from {
        transform: scale(1)
      }

      to {
        transform: scale(1.25)
      }
    }

    .arch-in::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(30, 6, 14, .15), rgba(30, 6, 14, .55))
    }

    .names {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .55)
    }

    .names .n {
      font-size: clamp(46px, 15vw, 64px);
      line-height: 1.05
    }

    .names .amp {
      font-size: 26px;
      color: #e2c27a;
      font-style: italic
    }

    .small {
      font-size: 17px;
      letter-spacing: .04em;
      opacity: .92;
      max-width: 300px
    }

    .when {
      font-size: 23px;
      font-weight: 600;
      color: #f1d79b
    }

    .cue {
      font-size: 15px;
      opacity: .75;
      animation: bob 2.2s ease-in-out infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(5px)
      }
    }

    /* sections */
    section {
      padding: 56px 0 8px
    }

    h2 {
      font-size: 34px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 4px
    }

    .rule {
      width: 64px;
      height: 1px;
      background: var(--gold);
      margin: 8px auto 22px
    }

    /* carousel */
    .car {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 14px;
      padding: 0 10vw 8px;
      scrollbar-width: none
    }

    .car::-webkit-scrollbar {
      display: none
    }

    .slide {
      flex: 0 0 80vw;
      max-width: 360px;
      scroll-snap-align: center;
      background: var(--card);
      padding: 8px 8px 14px;
      border: 1px solid var(--line);
      border-radius: 160px 160px 6px 6px
    }

    .slide img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 150px 150px 2px 2px;
      display: block
    }

    .slide p {
      margin-top: 10px;
      font-style: italic;
      color: var(--soft);
      padding: 0 8px
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px
    }

    .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      transition: .3s
    }

    .dots i.on {
      background: var(--gold);
      width: 22px;
      border-radius: 5px
    }

    /* countdown */
    .cd {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 6px 16px 0
    }

    .cd div {
      min-width: 64px;
      padding: 10px 4px;
      border: 1px solid var(--line);
      border-radius: 40px 40px 6px 6px;
      background: var(--card)
    }

    .cd b {
      display: block;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 600;
      color: var(--teal)
    }

    .cd span {
      font-size: 14px;
      color: var(--soft)
    }

    /* events */
    .ev {
      margin: 0 18px 18px;
      padding: 26px 18px 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 3px solid var(--gold);
      border-radius: 6px 6px 28px 28px;
      text-align: center
    }

    .ev h3 {
      font-size: 30px;
      font-weight: 600;
      color: var(--ink)
    }

    .ev .date {
      font-size: 21px;
      color: var(--teal);
      font-weight: 600;
      margin-top: 2px
    }

    .ev .t {
      margin-top: 8px;
      font-size: 20px
    }

    .ev .m {
      color: var(--soft);
      font-style: italic
    }

    .ev .v {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line)
    }

    .ev .v b {
      display: block;
      font-weight: 600
    }

    .btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px
    }

    .btn {
      font: inherit;
      font-size: 17px;
      text-decoration: none;
      padding: 9px 20px;
      border-radius: 99px;
      border: 1px solid var(--gold);
      color: var(--ink);
      background: none
    }

    .btn.p {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .btn:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px
    }

    footer {
      padding: 56px 24px 48px;
      color: var(--soft)
    }

    footer .script {
      font-size: 40px;
      color: var(--gold);
      line-height: 1.2
    }

    @media (prefers-reduced-motion:reduce) {
      .cue {
        animation: none
      }

      html {
        scroll-behavior: auto
      }
    }
  </style>
</head>

<body>
  <div id="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">English</button><button
      data-l="kn" aria-pressed="false">ಕನ್ನಡ</button></div>

  <header class="cover">
    <p class="small" data-t="with"></p>
    <div class="arch">
      <div class="arch-in">
        <div class="blur">
          <div class="bg" id="bg"></div>
        </div>
        <div class="names">
          <div class="script n" data-t="groom"></div>
          <div class="amp">&amp;</div>
          <div class="script n" data-t="bride"></div>
        </div>
      </div>
    </div>
    <p class="small" data-t="invite"></p>
    <p class="when" data-t="whenCover"></p>
    <a class="cue" href="#story" style="color:inherit;text-decoration:none" data-t="cue"></a>
  </header>

  <section id="story">
    <h2 class="script" data-t="story"></h2>
    <div class="rule"></div>
    <div class="car" id="car"></div>
    <div class="dots" id="dots"></div>
  </section>

  <section>
    <h2 class="script" data-t="count"></h2>
    <div class="rule"></div>
    <div class="cd" id="cd"></div>
  </section>

  <section id="events">
    <h2 class="script" data-t="cel"></h2>
    <div class="rule"></div>
    <div id="evs"></div>
  </section>

  <footer>
    <p class="script" data-t="foot1"></p>
    <p data-t="foot2" style="margin-top:6px"></p>
    <p class="script" style="font-size:34px;margin-top:18px;color:var(--ink)"><span data-t="groom"></span> &amp; <span
        data-t="bride"></span></p>
  </footer>
